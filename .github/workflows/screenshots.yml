name: Screenshots

# README 화면 캡처·시연 GIF는 화면·샘플이 바뀔 때만 다시 만든다 (CI 종단 테스트와 분리해 CI 시간을 줄임)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/WeldTrace.Web/**"
      - "data/sample/**"
      - "tools/ci/screenshots.py"
      - "tools/ci/demo.py"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # screenshots 브랜치에 올리기 위해
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (with simulator)
        run: docker compose up -d --build

      - name: Install browser and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
          pip install --quiet playwright==1.47.0
          python -m playwright install --with-deps chromium > /dev/null

      - name: Record live collection
        run: |
          # 가상 용접기가 도는 동안 모듈 수가 늘어나는 장면
          for i in $(seq 1 60); do
            modules=$(curl -fsS http://localhost:8080/api/overview 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['modules'])" 2>/dev/null || echo 0)
            [ "${modules:-0}" -ge 5 ] && break
            sleep 3
          done
          python tools/ci/demo.py live http://localhost:8080 video
          docker compose stop simulator

      - name: Load full sample
        run: |
          for n in $(seq 1 36); do curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break; sleep 5; done
          # 77가동일 샘플 전체를 inbox에 넣는다
          sample=$(ls data/sample/welding_*.csv.gz)
          docker compose cp "$sample" collector:/data/inbox/full_sample.csv.gz
          modules=0
          for i in $(seq 1 60); do
            modules=$(curl -fsS http://localhost:8080/api/overview | python3 -c "import sys,json; print(json.load(sys.stdin)['modules'])" || echo 0)
            echo "t=$((i*5))s modules=$modules"
            [ "$modules" -ge 3400 ] && break
            sleep 5
          done
          [ "$modules" -ge 3400 ] || { docker compose logs --no-color --tail 40 collector; exit 1; }
          echo "MODULES=$modules" >> "$GITHUB_ENV"

      - name: Capture screenshots and record tour
        run: |
          run() { "$@" > out.log 2>&1 || { tail -25 out.log | sed 's/^/::error::/'; exit 1; }; cat out.log; }
          run python tools/ci/screenshots.py http://localhost:8080 shots
          run python tools/ci/demo.py tour http://localhost:8080 video
          echo "::notice::Screenshots captured with ${MODULES} modules"

      - name: Build demo GIF
        run: |
          # 수집 장면 2배속, 나머지 1.25배속. 860px · 5fps · 64색 (README에서 바로 보이도록 용량을 줄임)
          ffmpeg -loglevel error -y -i video/live.webm -i video/tour.webm -filter_complex \
            "[0:v]setpts=0.5*PTS,fps=5,scale=860:-1:flags=lanczos[a];[1:v]setpts=0.8*PTS,fps=5,scale=860:-1:flags=lanczos[b];[a][b]concat=n=2:v=1:a=0,split[x][y];[x]palettegen=max_colors=64:stats_mode=diff[p];[y][p]paletteuse=dither=none:diff_mode=rectangle" \
            shots/demo.gif
          size=$(du -h shots/demo.gif | cut -f1)
          length=$(ffprobe -v error -show_entries format=duration -of csv=p=0 shots/demo.gif)
          echo "::notice::Demo GIF ${size}, ${length}s"

      - name: Publish screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - name: Stop stack
        if: always()
        run: docker compose down -v
