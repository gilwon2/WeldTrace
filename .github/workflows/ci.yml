name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 통합 테스트용 SQL Server (테스트 전용 일회성 컨테이너)
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "WeldTrace!Ci2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'WeldTrace!Ci2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      WELDTRACE_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=WeldTrace!Ci2026;TrustServerCertificate=True;Encrypt=False"
      WELDTRACE_PERF_OUT: ${{ github.workspace }}/TestResults/perf.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WeldTrace.sln

      - name: Build
        run: |
          set -o pipefail
          dotnet build WeldTrace.sln --no-restore -c Release 2>&1 | tee build.log
          # 컴파일러 경고를 주석으로 남긴다 (경고 0건 유지가 목표)
          { grep -oE "[^ ]+\.cs\([0-9]+,[0-9]+\): warning [A-Za-z0-9]+: .*" build.log || true; } | sort -u > warnings.txt
          while read -r line; do echo "::warning::$line"; done < warnings.txt
          echo "::notice::Build warnings: $(wc -l < warnings.txt)"

      - name: Test
        run: >
          dotnet test WeldTrace.sln --no-build -c Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Summarize test results
        if: always()
        run: python3 tools/ci/summarize.py TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic data generator is reproducible
        run: |
          python tools/synth/generate.py --days 5 --seed 7 --out /tmp/a
          python tools/synth/generate.py --days 5 --seed 7 --out /tmp/b
          diff -r /tmp/a /tmp/b

  # 종단 테스트: docker compose로 SQL Server + 시뮬레이터 + 수집기를 띄워 실제로 데이터가 흐르는지 확인
  e2e:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # 화면 캡처를 screenshots 브랜치에 올리기 위해
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for modules to be collected
        run: |
          sql() {
            docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
              -P 'WeldTrace!Local2026' -h -1 -W -Q "SET NOCOUNT ON; $1" 2>/dev/null | tr -d '[:space:]'
          }
          for i in $(seq 1 36); do
            modules=$(sql "IF DB_ID('WeldTrace') IS NOT NULL AND OBJECT_ID('WeldTrace.dbo.module') IS NOT NULL SELECT COUNT(*) FROM WeldTrace.dbo.module ELSE SELECT 0")
            echo "t=$((i*5))s modules=${modules:-0}"
            if [ "${modules:-0}" -ge 50 ]; then
              batches=$(sql "SELECT COUNT(*) FROM WeldTrace.dbo.ingest_batch WHERE status='SUCCEEDED'")
              welds=$(sql "SELECT COUNT(*) FROM WeldTrace.dbo.weld")
              ng=$(sql "SELECT COUNT(*) FROM WeldTrace.dbo.module WHERE verdict='NG'")
              echo "::notice::E2E: ${batches} files collected, ${welds} welds, ${modules} modules (${ng} NG) after $((i*5))s"
              # 웹 화면과 API가 같은 DB를 읽는지 확인
              for n in $(seq 1 12); do curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break; sleep 5; done
              home=$(curl -fsS http://localhost:8080/)
              echo "$home" | grep -q "최근 불량 모듈\|판정 완료 모듈" || { echo "::error::E2E: 웹 현황 화면에 판정 결과가 없습니다"; exit 1; }
              api_modules=$(curl -fsS http://localhost:8080/api/overview | python3 -c "import sys,json; print(json.load(sys.stdin)['modules'])")
              curl -fsS -o /dev/null http://localhost:8080/Drift && curl -fsS -o /dev/null http://localhost:8080/Modules && curl -fsS -o /dev/null http://localhost:8080/Batches
              echo "::notice::E2E web: pages OK, /api/overview modules=${api_modules}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::E2E: 3분 안에 모듈이 50개 이상 수집되지 않았습니다"
          docker compose logs --no-color --tail 40 collector | sed 's/^/::error::collector /'
          docker compose logs --no-color --tail 20 simulator | sed 's/^/::error::simulator /'
          docker compose logs --no-color --tail 20 web | sed 's/^/::error::web /'
          exit 1

      - name: Load full sample and capture screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 시뮬레이터를 멈추고 77가동일 샘플 전체를 inbox에 넣는다 (이미 적재된 행은 K2로 건너뜀)
          docker compose stop simulator
          sample=$(ls data/sample/welding_*.csv.gz)
          docker compose cp "$sample" collector:/data/inbox/zz_full_sample.csv.gz
          for i in $(seq 1 40); do
            modules=$(curl -fsS http://localhost:8080/api/overview | python3 -c "import sys,json; print(json.load(sys.stdin)['modules'])")
            echo "modules=$modules"
            [ "$modules" -ge 3400 ] && break
            sleep 5
          done
          pip install --quiet playwright==1.47.0
          python -m playwright install --with-deps chromium > /dev/null
          python tools/ci/screenshots.py http://localhost:8080 shots
          echo "::notice::Screenshots captured with ${modules} modules"

      - name: Publish screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - name: Stop stack
        if: always()
        run: docker compose down -v
