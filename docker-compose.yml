# WeldTrace 로컬 실행: SQL Server + 용접기 시뮬레이터 + 수집기 + 웹 화면
#   docker compose up -d --build
#   브라우저: http://localhost:8080
#   docker compose logs -f collector
#
# 통합 테스트만 돌릴 때는 sqlserver만 띄우고 WELDTRACE_TEST_SQL을 설정한다:
#   docker compose up -d sqlserver
#   Server=localhost,14333;User Id=sa;Password=WeldTrace!Local2026;TrustServerCertificate=True;Encrypt=False
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WeldTrace!Local2026"
    ports:
      # PC 쪽 포트는 14333 (1433은 Windows가 예약하거나 PC에 설치된 SQL Server가 쓰는 경우가 많다).
      # 127.0.0.1에만 열어 같은 네트워크의 다른 PC에서는 접속할 수 없게 한다.
      # 웹·수집기는 Docker 내부 네트워크(sqlserver,1433)로 접속하므로 이 값과 무관하다.
      - "127.0.0.1:${WELDTRACE_SQL_PORT:-14333}:1433"
    volumes:
      - weldtrace-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'WeldTrace!Local2026' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  collector:
    build:
      context: .
      args:
        PROJECT: WeldTrace.Collector
    environment:
      ConnectionStrings__WeldTrace: "Server=sqlserver,1433;Database=WeldTrace;User Id=sa;Password=WeldTrace!Local2026;TrustServerCertificate=True;Encrypt=False"
      Collector__InboxPath: /data/inbox
      Collector__ProcessedPath: /data/processed
      Collector__FailedPath: /data/failed
      Collector__PollSeconds: "5"
    volumes:
      - weldtrace-data:/data
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        PROJECT: WeldTrace.Web
        BASE: mcr.microsoft.com/dotnet/aspnet:8.0
    environment:
      ConnectionStrings__WeldTrace: "Server=sqlserver,1433;Database=WeldTrace;User Id=sa;Password=WeldTrace!Local2026;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # 합성 샘플을 3600배속(실제 1초 = 설비 1시간)으로 재생해 5초마다 조각 파일을 내려놓는다
  simulator:
    build:
      context: .
      args:
        PROJECT: WeldTrace.Simulator
    command: ["--source", "/app/sample/welding_*.csv.gz", "--inbox", "/data/inbox", "--speed", "3600", "--interval", "5"]
    volumes:
      - weldtrace-data:/data
    depends_on:
      - collector

volumes:
  weldtrace-sql:
  weldtrace-data:
